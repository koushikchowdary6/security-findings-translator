name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests (Claude call mocked; offline backend tested for real)
        run: PYTHONPATH=src python -m pytest tests/ -v
      - name: Offline demo (no API key needed)
        run: PYTHONPATH=src python src/translator.py examples/sample_findings.json --offline
